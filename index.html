<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nerdolaverso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --space-1:#0d0221; --space-2:#1a0b3d;
  --purple:#a855f7; --blue:#3b82f6; --pink:#ec4899; --gold:#fbbc19;
  --ink:#0a0118; --white:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif; color:var(--white);
  background:var(--space-1);
  min-height:100dvh; display:flex; align-items:flex-start; justify-content:center;
  padding:28px 18px 40px; overflow-x:hidden; position:relative;
}

/* ===== FUNDO ANIMADO (nebulosa que respira + estrelas) ===== */
.bg{position:fixed; inset:0; z-index:0; overflow:hidden;}
.neb{position:absolute; border-radius:50%; filter:blur(60px); opacity:.55; mix-blend-mode:screen;}
.neb.a{width:70vw; height:70vw; background:var(--purple); top:-15%; left:-10%;
  animation:drift1 18s ease-in-out infinite;}
.neb.b{width:60vw; height:60vw; background:var(--blue); bottom:-10%; right:-15%;
  animation:drift2 22s ease-in-out infinite;}
.neb.c{width:45vw; height:45vw; background:var(--pink); top:40%; left:30%;
  animation:drift3 26s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(8%,10%) scale(1.15);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1);}50%{transform:translate(-10%,-8%) scale(1);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-6%,6%) scale(1.2);}}
.stars{position:absolute; inset:0;}
.star{position:absolute; background:#fff; border-radius:50%;
  animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15; transform:scale(.6);}50%{opacity:.95; transform:scale(1);}}
/* estrelas cadentes ocasionais */
.shoot{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
  box-shadow:0 0 6px 1px #fff; opacity:0;}
.shoot::after{content:""; position:absolute; top:0; left:0; width:120px; height:1px;
  background:linear-gradient(90deg,#fff,transparent); transform:translateX(-120px);}
.shoot.s1{top:12%; left:70%; animation:shoot 7s ease-in 2s infinite;}
.shoot.s2{top:30%; left:40%; animation:shoot 9s ease-in 5s infinite;}
@keyframes shoot{0%{opacity:0; transform:translate(0,0) rotate(20deg);}
  6%{opacity:1;}12%{opacity:0; transform:translate(180px,90px) rotate(20deg);}100%{opacity:0;}}

/* ===== VINHETA DE ABERTURA (flip de páginas HQ) ===== */
.intro{position:fixed; inset:0; z-index:99; overflow:hidden;
  background:
    radial-gradient(900px 500px at 30% 20%, rgba(168,85,247,.55), transparent 60%),
    radial-gradient(800px 500px at 75% 80%, rgba(59,130,246,.5), transparent 60%),
    linear-gradient(180deg, var(--space-2), var(--space-1));
  display:flex; align-items:center; justify-content:center;
  animation:introOut .6s ease 2.2s forwards;}
.intro .flip{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background-size:cover; background-position:center; opacity:0;}
.intro .f1{background:
  repeating-linear-gradient(45deg, rgba(168,85,247,.92) 0 20px, rgba(124,58,237,.92) 20px 40px);
  animation:flip .55s ease 0s forwards;}
.intro .f2{background:
  repeating-linear-gradient(-45deg, rgba(59,130,246,.92) 0 20px, rgba(37,99,235,.92) 20px 40px);
  animation:flip .55s ease .3s forwards;}
.intro .f3{background:
  repeating-radial-gradient(circle, rgba(236,72,153,.92) 0 14px, rgba(219,39,119,.92) 14px 28px);
  animation:flip .55s ease .6s forwards;}
.intro .word{position:relative; z-index:2; font-family:'Bangers',cursive;
  font-size:clamp(34px,9vw,52px); color:var(--gold); -webkit-text-stroke:2px var(--ink);
  text-shadow:5px 5px 0 var(--ink); opacity:0; transform:scale(.4) rotate(-8deg);
  text-align:center; padding:0 20px; letter-spacing:1px;
  animation:stamp .5s cubic-bezier(.2,1.6,.4,1) 1.0s forwards;}
@keyframes flip{0%{opacity:0; transform:translateX(100%) skewX(-20deg);}
  40%{opacity:1;}60%{opacity:1;}100%{opacity:0; transform:translateX(-100%) skewX(-20deg);}}
@keyframes stamp{to{opacity:1; transform:scale(1) rotate(-4deg);}}
@keyframes introOut{to{opacity:0; visibility:hidden;}}

/* ===== CONTEUDO ===== */
.wrap{position:relative; z-index:2; width:100%; max-width:440px;
  animation:fadeUp .7s ease 2.3s both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(20px);}to{opacity:1; transform:none;}}

.hero{text-align:center; margin-bottom:22px;}
.portal{position:relative; width:172px; height:172px; margin:8px auto 18px;}
.ring{position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg, var(--purple), var(--blue), var(--pink), var(--gold), var(--purple));
  filter:blur(1px); animation:spin 8s linear infinite;
  box-shadow:0 0 40px rgba(168,85,247,.75), 0 0 70px rgba(59,130,246,.45);}
.ring::after{content:""; position:absolute; inset:8px; border-radius:50%; background:var(--space-1);}
@keyframes spin{to{transform:rotate(360deg);}}
.orbit{position:absolute; inset:-6px; border-radius:50%; animation:spin 14s linear infinite reverse;}
.orbit i{position:absolute; width:12px; height:12px; border-radius:50%; top:50%; left:-6px;
  margin-top:-6px; background:var(--gold); box-shadow:0 0 10px var(--gold);}
.orbit i:nth-child(2){left:auto; right:-6px; background:var(--pink); box-shadow:0 0 10px var(--pink);}
.avatar{position:absolute; inset:16px; border-radius:50%; border:4px solid var(--ink);
  overflow:hidden; z-index:3; box-shadow:inset 0 0 30px rgba(0,0,0,.4);
  animation:bob 4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.avatar img{width:100%; height:100%; object-fit:cover;}

.title{font-family:'Bangers',cursive; font-size:clamp(38px,11vw,46px); letter-spacing:1.5px;
  line-height:.95; padding:0 6px;
  text-shadow:3px 3px 0 var(--ink), 0 0 24px rgba(168,85,247,.6);
  -webkit-text-stroke:1.5px var(--ink);}
.title .pop{color:var(--gold); display:inline-block; animation:wob 3s ease-in-out infinite;}
@keyframes wob{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
.tagline{display:inline-block; margin-top:12px; font-size:12.5px; font-weight:800;
  letter-spacing:1.5px; text-transform:uppercase; background:var(--pink);
  border:2.5px solid var(--ink); border-radius:999px; padding:6px 16px;
  box-shadow:3px 3px 0 var(--ink); transform:rotate(-2deg);
  animation:swing 5s ease-in-out infinite;}
@keyframes swing{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);}}

.links{display:flex; flex-direction:column; gap:16px; margin-top:24px;}
.panel{position:relative; display:flex; align-items:center; gap:16px; text-decoration:none;
  color:var(--white); background:linear-gradient(135deg, rgba(168,85,247,.18), rgba(59,130,246,.18));
  border:3px solid var(--ink); border-radius:18px; padding:16px 18px;
  box-shadow:5px 5px 0 var(--ink);
  transition:transform .14s ease, box-shadow .14s ease;
  overflow:hidden; animation:floatp 5s ease-in-out infinite;}
.panel:nth-child(2){animation-delay:.6s;} .panel:nth-child(3){animation-delay:1.2s;}
@keyframes floatp{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.panel::before{content:""; position:absolute; top:0; right:0; width:90px; height:90px;
  background:radial-gradient(circle, rgba(255,255,255,.18) 1.4px, transparent 1.6px);
  background-size:9px 9px; opacity:.5; pointer-events:none;}
.panel:hover,.panel:active{transform:translate(-2px,-3px) rotate(-1deg); box-shadow:8px 9px 0 var(--ink);}
.icon{flex:0 0 54px; width:54px; height:54px; border-radius:14px; display:flex;
  align-items:center; justify-content:center; border:3px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink); animation:pulseI 2.6s ease-in-out infinite;}
.panel:nth-child(2) .icon{animation-delay:.4s;} .panel:nth-child(3) .icon{animation-delay:.8s;}
@keyframes pulseI{0%,100%{transform:scale(1) rotate(0);}50%{transform:scale(1.08) rotate(-3deg);}}
.icon svg{width:28px; height:28px;}
.i-wa{background:#25D366;} .i-mail{background:var(--gold);} .i-tt{background:#000;}
.txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
.txt .lbl{font-family:'Bangers',cursive; font-size:23px; letter-spacing:1px; line-height:1;
  -webkit-text-stroke:.5px var(--ink);}
.txt .sub{font-size:12.5px; font-weight:600; color:rgba(255,255,255,.72); line-height:1.2;}
.burst{position:absolute; right:-6px; top:12px; transform:scale(0) rotate(-12deg);
  font-family:'Bangers',cursive; font-size:17px; color:var(--ink); background:var(--gold);
  padding:3px 10px; border:2.5px solid var(--ink); border-radius:8px;
  box-shadow:2px 2px 0 var(--ink); transition:transform .16s cubic-bezier(.2,1.4,.4,1);
  pointer-events:none;}
.panel:hover .burst,.panel:active .burst{transform:scale(1) rotate(-8deg);}
.footer{text-align:center; margin-top:28px; font-size:11.5px; font-weight:600;
  letter-spacing:.5px; color:rgba(255,255,255,.45);}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;}
  .intro{display:none;}
}
</style>
</head>
